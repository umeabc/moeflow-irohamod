<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="moeflow-build" content="iroha16-fix15" />
    <script>
      // 在样式与应用加载前恢复偏好，兼容旧版 darkMode 存储。
      (function () {
        function stored(key, fallback) {
          try {
            var value = JSON.parse(localStorage.getItem(key));
            return value === null ? fallback : value;
          } catch (_) {
            return fallback;
          }
        }
        var palette = stored('palette', 'default');
        document.documentElement.dataset.theme = stored('darkMode', false) === true ? 'dark' : 'light';
        document.documentElement.dataset.palette = palette === 'azure' || palette === 'miku' ? palette : 'default';
      })();
    </script>
    <link rel="icon" href="/static/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"/>
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="MoeFlow" />
    <link rel="apple-touch-icon" href="/static/logo192.png" />
    <link rel="manifest" href="/static/manifest.json" />
    <title>MoeFlow</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx" ></script>
  </body>
</html>
